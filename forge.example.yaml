# Forge — a small office you bring ideas to.
# Copy this to forge.yaml and edit. Secrets never go in here: anything
# sensitive is named by the environment variable that holds it.

treasury:
  # What you are staking. The office is told this is all it gets.
  seed_usd: 50.00
  # Stop everything if equity falls this far below the seed.
  max_drawdown_pct: 40
  # Never hand this share of the seed to anything.
  reserve_pct: 20

office:
  # auto  = use Claude when ANTHROPIC_API_KEY is set, else the scripted brain
  # claude / scripted force one or the other.
  brain: auto
  model: claude-opus-5

  # How often the staff meet: read anything new, then pick up their piece
  # of whatever is already on the board.
  standup_interval_minutes: 60

  # The survival rule, which applies to ventures rather than to ideas. A
  # venture gets this much rope, then has to show it earns more than it
  # costs plus min_profit_usd, or it collects a strike. max_strikes strikes
  # and it is eliminated for good.
  grace_ticks: 8
  grace_hours: 24
  min_profit_usd: 1.00
  max_strikes: 3

  # Your wallet, shown along the bottom of the office. Paste the public
  # address from Phantom or wherever you keep it: watch-only is the
  # recommended setup, and nothing here can move the money.
  wallet_address: ""
  # Only set this if something here will ever place a real order. It is a
  # solana-keygen style key file and it must hold only what you can lose.
  wallet_keyfile: ""
  rpc_url: "https://api.mainnet-beta.solana.com"

  host: "127.0.0.1"
  port: 8765

ventures:
  # An office starts empty, and that is the normal state. You bring ideas;
  # the staff read them, argue about them and split up the work.
  #
  # A "venture" is only what an idea becomes once it needs to run on a
  # schedule of its own without being asked. Two are bundled as worked
  # examples — a zero-cost colouring-book factory and a paper-only memecoin
  # trader — and both are off. Turn one on only if you actually want it:
  #
  #   coloringbook:
  #     enabled: true
  #     interval_minutes: 720
  #     max_capital_usd: 0
  #     options:
  #       art_pages: 30
  #       price_usd: 7.99
  #
  #   memecoin:
  #     enabled: true
  #     interval_minutes: 15
  #     max_capital_usd: 15.00
  #     options:
  #       mode: paper               # it refuses to go live until it has earned it
  #       i_understand_the_risk: false
  #       max_position_usd: 3.00
  #       daily_loss_limit_usd: 5.00

notify:
  desktop: true
  telegram:
    enabled: false
    token_env: FORGE_TELEGRAM_TOKEN
    chat_id_env: FORGE_TELEGRAM_CHAT_ID

workdir: .forge
out_dir: out
